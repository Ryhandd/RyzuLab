<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RyzuBlog — Guestbook</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 32px 20px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .who { font-size: 11px; color: #64748b; font-family: ui-monospace, Menlo, monospace; }
  .panel { padding: 18px; border-radius: 12px; background: #1e293b; border: 1px solid #334155; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 14px; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .12em; }
  label { display: block; font-size: 11px; color: #94a3b8; margin: 10px 0 5px; text-transform: uppercase; letter-spacing: .1em; }
  input, textarea { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #334155;
                    background: #0f172a; color: #e2e8f0; font-size: 13px; font-family: inherit; }
  textarea { min-height: 66px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: linear-gradient(90deg,#22d3ee,#818cf8);
           color: #06121f; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover { filter: brightness(1.08); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .row button.ghost { background: #334155; color: #e2e8f0; font-weight: 500; }
  .comment { padding: 12px 14px; border-radius: 10px; background: #172033; border: 1px solid #273449; margin-bottom: 10px; }
  .comment .meta { font-size: 11px; color: #64748b; margin-bottom: 6px; }
  .comment .body { font-size: 13px; line-height: 1.6; word-break: break-word; }
  .flagbox { display: none; margin-top: 12px; padding: 14px; border-radius: 8px; background: #0b1220;
             border: 1px solid #164e63; font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: #22d3ee; word-break: break-all; }
  .flagbox.show { display: block; }
  .status { font-size: 12px; color: #64748b; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RyzuBlog <span style="color:#22d3ee">.</span></h1>
    <span class="who" id="who">guest</span>
  </header>

  <div class="panel">
    <h2>Leave a comment</h2>
    <label for="name">Name</label>
    <input id="name" placeholder="anonymous" />
    <label for="text">Comment</label>
    <textarea id="text" placeholder="Say something nice..."></textarea>
    <div class="row">
      <button id="post">Post comment</button>
      <button id="bot" class="ghost">Simulate admin bot visit</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="panel">
    <h2>Comments</h2>
    <div id="list"></div>
    <div class="flagbox" id="flagbox"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Stored XSS lab. Comments are rendered with innerHTML (the vulnerable sink),
// exactly like the server-side template in the backstory. The simulated admin
// bot is a sandboxed iframe in the same origin, so any script the attacker
// injects runs in the "admin" context and can read the cookie placed there by
// the bot before it visits.
// ---------------------------------------------------------------------------
const ADMIN_COOKIE = "session=admin_ffe4a91c8b2d4f7e"; // the bot's session cookie

let comments = [
  { name: "mira", text: "Great article, thanks!" },
  { name: "devon", text: "Does anyone know when the new build ships?" },
];

const $list = document.getElementById("list");
const $name = document.getElementById("name");
const $text = document.getElementById("text");
const $status = document.getElementById("status");
const $flagbox = document.getElementById("flagbox");
const $who = document.getElementById("who");

const FLAG = "RYZU{stored_xss_cookie_stealer}";

// The bot navigates to the guestbook with its admin cookie set. Because cookies
// are per-origin and this page is on the same origin, we emulate that by having
// the bot's script read a value only the bot knows, then expose it via a global
// the injected payload can exfiltrate.
function render() {
  $list.innerHTML = "";
  comments.forEach((c) => {
    const div = document.createElement("div");
    div.className = "comment";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = c.name + " · just now";
    const body = document.createElement("div");
    body.className = "body";
    // VULNERABLE SINK — identical in effect to a server that echoes the raw
    // comment into the page without escaping.
    body.innerHTML = c.text;
    div.appendChild(meta);
    div.appendChild(body);
    $list.appendChild(div);
  });
}

// Expose the bot secret on window only while the bot "session" is active; the
// injected script is expected to read it and prove exfiltration happened.
window.__BOT_CONTEXT__ = false;

function runAdminBot() {
  $status.textContent = "bot is reviewing the newest comments…";
  window.__BOT_CONTEXT__ = true;
  $who.textContent = "admin (bot)";
  document.cookie = ADMIN_COOKIE + "; path=/";

  // The payload a stored-XSS exploit would plant. If the attacker's comment
  // made it into innerHTML, this code now runs with the bot's privileges.
  setTimeout(() => {
    let exfiltrated = null;
    const originalFlag = window.__reportStolenCookie;
    window.__reportStolenCookie = (v) => { exfiltrated = v; };

    try {
      // Re-run the injected scripts by re-assigning the innerHTML of each body.
      document.querySelectorAll(".comment .body").forEach((el) => {
        const html = el.innerHTML;
        el.innerHTML = "";
        el.innerHTML = html;
      });
    } catch (e) { /* ignore */ }

    window.__BOT_CONTEXT__ = false;
    $who.textContent = "guest";

    if (exfiltrated && String(exfiltrated).includes("admin_")) {
      $flagbox.className = "flagbox show";
      $flagbox.textContent = FLAG;
      $status.textContent = "bot finished — your payload executed with its cookie.";
    } else {
      $status.textContent = "bot visited, but nothing was exfiltrated.";
    }
    window.__reportStolenCookie = originalFlag;
  }, 1200);
}

document.getElementById("post").addEventListener("click", () => {
  const name = $name.value.trim() || "anonymous";
  const text = $text.value;
  if (!text.trim()) { $status.textContent = "write something first."; return; }
  comments.push({ name, text });
  $text.value = "";
  $status.textContent = "comment posted.";
  render();
  // Real guestbooks send the admin bot to review new comments automatically.
  setTimeout(runAdminBot, 700);
});

document.getElementById("bot").addEventListener("click", runAdminBot);

render();
</script>
</body>
</html>
