<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RyzuSupport — Ticket Portal</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 32px 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .who { font-size: 11px; color: #64748b; font-family: ui-monospace, Menlo, monospace; }
  .panel { padding: 18px; border-radius: 12px; background: #1e293b; border: 1px solid #334155; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 14px; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .12em; }
  label { display: block; font-size: 11px; color: #94a3b8; margin: 10px 0 5px; text-transform: uppercase; letter-spacing: .1em; }
  input { padding: 9px 11px; border-radius: 8px; border: 1px solid #334155;
          background: #0f172a; color: #e2e8f0; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
  input:focus { outline: none; border-color: #38bdf8; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: linear-gradient(90deg,#22d3ee,#818cf8);
           color: #06121f; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: #334155; color: #e2e8f0; font-weight: 500; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .endpoint { font-size: 11px; color: #64748b; margin-bottom: 10px; font-family: ui-monospace, Menlo, monospace;
              background: #0b1220; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 10px; word-break: break-all; }
  .endpoint b { color: #7dd3fc; }
  pre { margin: 0; padding: 14px; border-radius: 10px; background: #0b1220; border: 1px solid #1e293b;
        font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: #cbd5e1; white-space: pre-wrap;
        word-break: break-word; max-height: 360px; overflow: auto; }
  .lvl { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 700;
         text-transform: uppercase; letter-spacing: .08em; }
  .lvl.user { background: rgba(56,189,248,.14); color: #7dd3fc; border: 1px solid rgba(56,189,248,.3); }
  .lvl.admin { background: rgba(52,211,153,.14); color: #6ee7b7; border: 1px solid rgba(52,211,153,.3); }
  .status { font-size: 12px; color: #64748b; margin-left: 6px; }
  .flagbox { display: none; margin-top: 12px; padding: 14px; border-radius: 8px; background: #0b1220;
             border: 1px solid #164e63; font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: #22d3ee; word-break: break-all; }
  .flagbox.show { display: block; }
  .hintbar { margin-top: 4px; font-size: 10px; color: #475569; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RyzuSupport <span style="color:#22d3ee">.</span></h1>
    <span class="who">logged in as: <b style="color:#e2e8f0">user_devon</b> &middot; session ticket #42</span>
  </header>

  <div class="panel">
    <h2>Fetch a ticket</h2>
    <div class="endpoint">GET <b>/api/ticket/&lt;id&gt;</b> &middot; Authorization: Bearer &lt;your session&gt;</div>
    <div class="row">
      <label style="margin:0" for="id">ticket id</label>
      <input id="id" value="42" style="width:100px" />
      <button id="go">Send request</button>
      <button id="reset" class="ghost">Reset to #42</button>
      <span class="status" id="status"></span>
    </div>
    <p class="hintbar">The server only checks that you are logged in — it never checks that the ticket belongs to you.</p>
  </div>

  <div class="panel">
    <h2>Response <span id="lvlbadge"></span></h2>
    <pre id="out">// response will appear here</pre>
    <div class="flagbox" id="flagbox"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// IDOR lab. A tiny "API" keyed by ticket id. The only check performed is
// "is there a bearer token at all" — there is no comparison between the
// caller's own id (42) and the id being requested, which is exactly the
// missing ownership check described in the backstory.
// ---------------------------------------------------------------------------
const SESSION_TOKEN = "Bearer sess_devon_7f3a1c9e";
const FLAG = "RYZU{IDOR_ticket_escalation}";

const TICKETS = {
  42: {
    id: 42,
    subject: "Password reset",
    owner: "user_devon",
    status: "open",
    access_level: "user",
    internal_notes: "customer requested a password reset link, sent at 09:14 UTC.",
  },
  17: {
    id: 17,
    subject: "Billing question",
    owner: "user_mira",
    status: "closed",
    access_level: "user",
    internal_notes: "refund processed, see invoice #881.",
  },
  1001: {
    id: 1001,
    subject: "[INTERNAL] Admin escalation queue",
    owner: "admin",
    status: "open",
    access_level: "admin",
    internal_notes: "Flag: " + FLAG,
  },
};

const $id = document.getElementById("id");
const $out = document.getElementById("out");
const $status = document.getElementById("status");
const $flagbox = document.getElementById("flagbox");
const $lvlbadge = document.getElementById("lvlbadge");

// Simulates the vulnerable backend handler: GET /api/ticket/:id
function fetchTicket(rawId) {
  const id = Number(rawId);

  // The ONLY check the server performs: is there any bearer token present?
  // There is no check like `if (ticket.owner !== currentUser) return 403`.
  const authorized = SESSION_TOKEN.startsWith("Bearer ");
  if (!authorized) {
    return { httpStatus: 401, body: { error: "unauthorized" } };
  }

  const ticket = TICKETS[id];
  if (!ticket) {
    return { httpStatus: 404, body: { error: "ticket not found" } };
  }
  return { httpStatus: 200, body: ticket };
}

function render(rawId) {
  const { httpStatus, body } = fetchTicket(rawId);
  $out.textContent = `HTTP ${httpStatus}\n` + JSON.stringify(body, null, 2);
  $lvlbadge.innerHTML = "";
  $flagbox.className = "flagbox";
  $flagbox.textContent = "";

  if (httpStatus === 200) {
    const lvl = body.access_level || "user";
    $lvlbadge.innerHTML = `<span class="lvl ${lvl}">${lvl}</span>`;
    $status.textContent = `ticket #${body.id} returned — owner: ${body.owner}`;

    if (lvl === "admin" && String(body.internal_notes || "").includes("RYZU{")) {
      $flagbox.className = "flagbox show";
      $flagbox.textContent = body.internal_notes.replace("Flag: ", "");
    }
  } else {
    $status.textContent = "request failed.";
  }
}

document.getElementById("go").addEventListener("click", () => render($id.value));
document.getElementById("reset").addEventListener("click", () => { $id.value = "42"; render("42"); });
$id.addEventListener("keydown", (e) => { if (e.key === "Enter") render($id.value); });

render("42");
</script>
</body>
</html>
